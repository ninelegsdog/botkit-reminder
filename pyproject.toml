[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit-reminder"
version = "1.0.0"
description = "Telegram bot for reminders and newsletters"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ninelegsdog", email = "algtro@users.noreply.github.com"},
]
dependencies = [
    "aiogram>=3.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "aiohttp>=3.9",
    "botkit-core @ git+https://github.com/ninelegsdog/botkit-core@v0.5.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.100",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "requests>=2.31",
    "structlog>=24.0",
]
e2e = [
    "telethon>=1.34",
    "python-dotenv>=1.0",
]

[project.scripts]
bot = "botkit_reminder.bot:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=68 -m 'not integration'"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: marks tests as integration tests (deselect with -m not integration)",
    "no_req: fully offline, no external HTTP/Telegram requests",
    "req: requires network and/or a real external service (Telegram E2E, payment gateways)",
    "unit: isolated unit test",
    "webhook: HTTP/webhook endpoint test",
    "e2e: real Telegram E2E via MTProto",
    "serial: must not run in parallel via xdist",
]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true
omit = ["tests/*", "scripts/*", "bot.py", "src/core/tgwebhook.py"]

[tool.ruff]
line-length = 120
ignore = ["BLE001", "S110", "LOG015", "PYI036", "DTZ007", "TRY401", "E711", "RUF100"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["attr-defined", "no-any-return", "call-arg", "arg-type"]

[[tool.mypy.overrides]]
module = "tests.e2e.*"
ignore_errors = true
