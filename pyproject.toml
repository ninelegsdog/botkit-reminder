[project]
name = "botkit-reminder"
version = "1.0.0"
description = "Telegram bot for reminders and newsletters"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ninelegsdog", email = "algtro@users.noreply.github.com"},
]
dependencies = [
    "aiogram>=3.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "aiohttp>=3.9",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.100",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.scripts]
bot = "botkit_reminder.bot:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70 -m 'not integration'"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiogram.*"
ignore_errors = true

[tool.hypothesis]
database = ".hypothesis/examples.db"
print_blob = true
